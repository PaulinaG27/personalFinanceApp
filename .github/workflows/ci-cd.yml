name: CI/CD - Personal Finance App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # JOB 1: Build & Test del Backend (Java)
 
  backend-ci:
    name: Backend - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y correr tests con Maven
        working-directory: ./backend
        run: mvn clean verify

      - name: Empaquetar JAR (sin tests)
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # JOB 2: Build del Frontend (React/Vite)

  frontend-ci:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Instalar dependencias
        working-directory: ./frontend
        run: pnpm install

      - name: Build de producción
        working-directory: ./frontend
        run: pnpm run build

      - name: Guardar build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # JOB 3: Notificación final

  notify:
    name: Pipeline completado
    runs-on: ubuntu-latest
    needs: [ backend-ci, frontend-ci ]
    if: always()

    steps:
      - name: Resultado del pipeline
        run: |
          echo "✅ Backend CI: ${{ needs.backend-ci.result }}"
          echo "✅ Frontend CI: ${{ needs.frontend-ci.result }}"
